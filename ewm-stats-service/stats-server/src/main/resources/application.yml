server:
  port: 9090

spring:
  application:
    name: stats-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6541/stats}
    username: ${SPRING_DATASOURCE_USERNAME:stats}
    password: ${SPRING_DATASOURCE_PASSWORD:stats}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    ru.practicum: INFO
    org.springframework.web: INFO